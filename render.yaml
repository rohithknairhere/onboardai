# Render Blueprint: one free web service built from the Dockerfile. The website
# and the API share one address. Set GROQ_API_KEY in the Render dashboard when
# asked; it is never stored in this repository.
services:
  - type: web
    name: onboardai
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false
